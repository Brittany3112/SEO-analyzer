<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>4G 吃到飽 SEO 數據分析儀表板</title>
    <!-- 引入 Chart.js 畫圖工具 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        .hidden { display: none; }
        .card { background: #f9f9f9; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>4G 吃到飽 SEO 數據儀表板</h1>

    <!-- 登入區塊 -->
    <div id="login-section" class="card">
        <h3>請先登入</h3>
        <input type="email" id="email" placeholder="輸入 Email"><br><br>
        <input type="password" id="password" placeholder="輸入密碼"><br><br>
        <button onclick="login()">登入</button>
        <p id="login-error" style="color: red;"></p>
    </div>

    <!-- 圖表與內容區塊（登入後才顯示） -->
    <div id="dashboard-section" class="card hidden">
        <h3>主題分群統計圖表</h3>
        <canvas id="myChart" width="400" height="200"></canvas>
        <button onclick="logout()" style="margin-top: 20px;">登出</button>
    </div>

    <script>
        // 填入妳的 Supabase 專案資訊
        const SUPABASE_URL = 'https://kmtplcbcgtyjzupseclr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttdHBsY2JjZ3R5anp1cHNlY2xyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNzkyNDAsImV4cCI6MjEwMTc1NTI0MH0.Qg3QajB281MDDqKhc8HymCYaIScDrc-eqv--xiYzwbQ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                document.getElementById('login-error').innerText = '登入失敗：' + error.message;
            } else {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadChartData();
            }
        }

        async function loadChartData() {
            // 從 Supabase 的 seo_data 表格抓取資料
            const { data, error } = await supabase.from('seo_data').select('theme, count');
            if (error) {
                console.error('抓取資料失敗', error);
                return;
            }

            // 簡單將資料依 theme 分群加總
            let themeCounts = {};
            data.forEach(row => {
                let theme = row.theme || '未分類';
                themeCounts[theme] = (themeCounts[theme] || 0) + (row.count || 1);
            });

            const labels = Object.keys(themeCounts);
            const values = Object.values(themeCounts);

            // 用 Chart.js 畫長條圖
            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Entity 主題分群數量',
                        data: values,
                        backgroundColor: 'rgba(54, 162, 235, 0.5)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                }
            });
        }

        function logout() {
            supabase.auth.signOut();
            location.reload();
        }
    </script>
</body>
</html>
